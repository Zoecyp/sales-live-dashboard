<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模擬銷售資料即時儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background: #f8f9fa; color: #333; }
        h1 { text-align: center; color: #1a252f; margin-bottom: 10px; }
        .metrics { display: flex; justify-content: space-around; max-width: 1200px; margin: 0 auto 20px auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .metric-box { text-align: center; }
        .metric-title { font-size: 14px; color: #6c757d; }
        .metric-value { font-size: 22px; font-weight: bold; color: #2c3e50; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 1200px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>
    <h1>📊 模擬銷售資料即時分析儀表板 (Aiven Live)</h1>
    
    <div class="metrics">
        <div class="metric-box"><div class="metric-title">總筆數</div><div class="metric-value" id="totalRecords">--</div></div>
        <div class="metric-box"><div class="metric-title">總售出數量</div><div class="metric-value" id="totalQty">--</div></div>
        <div class="metric-box"><div class="metric-title">總退貨數量</div><div class="metric-value" id="totalReturns">--</div></div>
        <div class="metric-box"><div class="metric-title">總淨銷售額</div><div class="metric-value" style="color:#27ae60;" id="totalNetRev">--</div></div>
    </div>

    <div class="grid-container">
        <div class="card full-width"><h3>📈 每日淨銷售額折線圖</h3><canvas id="dailyChart" height="90"></canvas></div>
        <div class="card"><h3>📊 各商品淨銷售額</h3><canvas id="prodChart"></canvas></div>
        <div class="card"><h3>🍕 各分類淨銷售額占比</h3><canvas id="catChart"></canvas></div>
        <div class="card"><h3>🏪 各通路銷售比較</h3><canvas id="channelChart"></canvas></div>
        <div class="card"><h3>🎯 售出數量與淨銷售額散佈圖</h3><canvas id="scatterChart"></canvas></div>
    </div>

    <script>
        async function loadDashboardData() {
            try {
                const response = await fetch('./data.json?t=' + new Date().getTime());
                const data = await response.json();

                document.getElementById('totalRecords').innerText = data.total_records + ' 筆';
                document.getElementById('totalQty').innerText = data.total_qty.toLocaleString() + ' 件';
                document.getElementById('totalReturns').innerText = data.total_returns.toLocaleString() + ' 件';
                document.getElementById('totalNetRev').innerText = 'NT$ ' + data.total_net_rev.toLocaleString();

                new Chart(document.getElementById('dailyChart'), {
                    type: 'line',
                    data: { labels: data.daily.labels, datasets: [{ label: '淨銷售額', data: data.daily.values, borderColor: '#3498db', backgroundColor: 'rgba(52, 152, 219, 0.1)', fill: true, tension: 0.2 }] }
                });

                new Chart(document.getElementById('prodChart'), {
                    type: 'bar',
                    data: { labels: data.product.labels, datasets: [{ label: '淨銷售額', data: data.product.values, backgroundColor: '#2ecc71' }] },
                    options: { indexAxis: 'y' }
                });

                new Chart(document.getElementById('catChart'), {
                    type: 'pie',
                    data: { labels: data.category.labels, datasets: [{ data: data.category.values, backgroundColor: ['#e74c3c', '#3498db', '#2ecc71'] }] }
                });

                new Chart(document.getElementById('channelChart'), {
                    type: 'bar',
                    data: { labels: data.channel.labels, datasets: [{ label: '淨銷售額', data: data.channel.values, backgroundColor: '#f39c12' }] }
                });

                const scatterPoints = data.scatter.map(item => ({ x: item.quantity, y: item.net_revenue }));
                new Chart(document.getElementById('scatterChart'), {
                    type: 'scatter',
                    data: { datasets: [{ label: '銷售單筆紀錄', data: scatterPoints, backgroundColor: '#9b59b6' }] },
                    options: { scales: { x: { title: { display: true, text: '售出數量' } }, y: { title: { display: true, text: '淨銷售額' } } } }
                });

            } catch (error) {
                console.error("載入 JSON 失敗:", error);
            }
        }

        loadDashboardData();
    </script>
</body>
</html>
